# dsh bundle patch: one command installs the whole Content Studio feature —
# this plugin plus its host Remote gateways (`dsh plugin add` consumes
# this via dsh.bundle.patch). The browser half is discovered from the
# dsh.client manifest of the loaded entry; the host halves register the
# contentOutputs / contentSchedule / contentTopics Remotes this plugin's
# client half mounts, and the image-generation provider backs the create
# workbench's storyboard and cover rendering.
- insert:
    - id: content-outputs
      name: '@deepseek-ai/dsh-content-outputs'
    - id: content-schedule
      name: '@deepseek-ai/dsh-content-schedule'
    - id: content-topics
      name: '@deepseek-ai/dsh-content-topics'
    - id: image-generation
      name: '@deepseek-ai/dsh-image-generation'
    - id: ui-content-studio
      name: '@deepseek-ai/dsh-client-ui-content-studio'
