# Quant research plugin, real-use composition: kernel-backed market data,
# deterministic indicators, and the daily SMA-cross backtester, all behind the
# research-only compliance gate. The synthetic data source keeps every call
# offline; switch it to akshare (and install kernel-py/requirements.txt) for
# live A-share data.

# The session hub (the `sessions` service) and the agent registry
# (`agents`) the declarative agent-loop waits on.
- id: session
  name: '@deepseek-ai/dsh-session'

# Read-model projections the agent loop awaits (`sessionProjections`).
- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

# The tool registry (`tools`) the loop, tool-jobs, and the quant plugin mount on.
- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: agent
  name: '@deepseek-ai/dsh-agent'

- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

# Managed child-process groups: the Python kernel runs here, one short-lived
# process per request, terminated through the seam's terminate ladder.
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

# Storage hub + json backend + domain layer: the quant_research domain's
# compliance-denial audit lives here.
- id: storage
  name: '@deepseek-ai/dsh-storage'

- id: storage-json
  name: '@deepseek-ai/dsh-storage-json'
  config:
    root: './.storages'

- id: storage-domain
  name: '@deepseek-ai/dsh-storage-domain'
  config:
    backend: json

# The adapter registry (`llm`) every provider registers into.
- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'

# The agent loop with one declarative startup agent (the retired spine demo's
# role): the research persona rides system-prompt's deployment prefix.
- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents:
      - id: main
        provider: deepseek-official
        model: deepseek-v4-flash
        cwd: !!js process.cwd()

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    personaPrefix: |
      你是量化研究助手：只做投研、技术指标与模拟回测；所有结论仅供研究参考，
      不构成投资建议；插件没有实盘通道，也不要尝试绕过合规拦截。

# Session persistence for the demo runs (replay-friendly, uncompressed in the
# snapshot lane).
- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"

# Approval capability for the PET tools' human-review flow. In headless
# compositions without an answerer, asks fail closed (unavailable → rejected).
- id: approval
  name: '@deepseek-ai/dsh-user-approval'

# Background job registry + model-facing controller: quant_optimize_params
# runs its parameter grid as one cancellable background job collected
# through job_output.
- id: tasks
  name: '@deepseek-ai/dsh-jobs-local'

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

- id: quant-research
  name: '@deepseek-ai/dsh-quant-research'
  config:
    dataSource: synthetic
    kernelCommand: !!js "process.platform === 'win32' ? 'python' : 'python3'"
    cacheDir: './.cache'
