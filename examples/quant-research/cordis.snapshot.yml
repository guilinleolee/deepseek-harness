# Keyless snapshot counterpart: include the real composition, replace the
# live model with the scripted quant-mock adapter, and keep the tool path
# (kernel subprocess, synthetic source, storage audit, compliance gate)
# fully real. The mock drives three rounds: one kline fetch, one backtest,
# and one red-line denial.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: agent-loop
        name: '@deepseek-ai/dsh-agent-loop'
        config:
          agents:
            - id: main
              provider: quant-mock
              model: quant-mock
              cwd: !!js process.cwd()
      - id: system-prompt
        name: '@deepseek-ai/dsh-system-prompt'
        config:
          personaPrefix: 'Keyless quant-research snapshot.'
      - insert:
          - id: quant-mock-llm
            name: './tests/fixtures/quant-mock-llm.ts'
