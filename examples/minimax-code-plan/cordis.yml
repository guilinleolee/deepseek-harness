# MiniMax Code Plan profile.
#
# One-shot agent that talks to MiniMax through its Anthropic-compatible
# endpoint and generates images through the official MiniMax image API.
# No DeepSeek account and no muapi key are needed.
#
# Prerequisites:
#   - MINIMAX_API_KEY in the environment (the Code Plan key works here).
#   - The image adapter needs the same key: see dragon-assets/skills/async-task-pattern/adapters/minimax-image.sh.

# User-settings document ($DSH_HOME/settings.yaml, hot-reloaded): a
# `llm-deepseek:` section there overrides the adapter entry below without a
# restart.
- id: settings
  name: '@deepseek-ai/dsh-settings-file'

# Credential store: the live process environment over $DSH_HOME/.credentials.yaml
# (owner-only file, hot-reloaded). The adapter resolves MINIMAX_API_KEY through
# it at each request, so no key is inlined in this file.
- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

# The Messages adapter, pointed at MiniMax's Anthropic-compatible endpoint.
# llm-deepseek speaks the Messages protocol, so a MiniMax base URL works
# without a separate adapter.
- id: llm
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    baseURL: https://api.minimaxi.com/anthropic
    models:
      - id: MiniMax-M2.7
        displayName: MiniMax M2.7
        inputModalities: [text, image]

# Managed child-process groups for the bash executor (spawn/kill/output plumbing).
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    timeoutMs: 60000

# Web search and fetch, so the agent can research without DeepSeek credits.
- id: web
  name: '@deepseek-ai/dsh-web'

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'

# The agent loop and the headless surface.
- id: agent
  name: '@deepseek-ai/dsh-agent'

- id: headless
  name: '@deepseek-ai/dsh-headless'
