<!-- 瑞士风格品牌母版 (Swiss Brand Master Template) -->
<div class="poster-card" style="width: 600px; background-color: #F5F5F0; border: 4px solid #1E3A5F; padding: 60px 45px; position: relative; overflow: hidden; font-family: 'Noto Sans SC', sans-serif; display: flex; flex-direction: column; gap: 50px;">

    <!-- 固定元素 1: 极淡背景网格 -->
    <div style="position: absolute; inset: 0; background-image: radial-gradient(#1E3A5F 1px, transparent 1px); background-size: 25px 25px; opacity: 0.04; z-index: 1;"></div>

    <!-- 固定元素 2: 10% 透明度水印 -->
    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; text-align: center; font-size: 64px; font-weight: 900; color: #1E3A5F; opacity: 0.1; white-space: nowrap; pointer-events: none; z-index: 2; letter-spacing: 0.05em;">
        卡巴格企业管理培训
    </div>

    <!-- 内容层 -->
    <div style="position: relative; z-index: 10; display: flex; flex-direction: column; gap: 45px;">

        <!-- 固定元素 3: 品牌页眉 -->
        <header style="display: flex; justify-content: space-between; align-items: center;">
            <span style="background-color: #1E3A5F; color: white; padding: 6px 16px; font-size: 20px; font-weight: 900; letter-spacing: -0.02em;">卡巴格企业管理培训</span>
            <span style="color: #C8102E; font-family: 'JetBrains Mono', monospace; font-style: italic; font-weight: 900; font-size: 20px;">SYSTEM v1.0</span>
        </header>

        <!-- 动态内容区 -->
        <div id="dynamic-content" style="display: flex; flex-direction: column; gap: 40px;">

            <!-- 1. 规范主标题 -->
            <div id="main-title-section">
                <h1 style="font-weight: 900; font-size: 60px; line-height: 1.1; letter-spacing: -0.05em;">
                    <span style="color: #1E3A5F;">[蓝色标题段]</span><br/>
                    <span style="color: #C8102E;">[红色标题段]</span>
                </h1>
            </div>

            <!-- 2. 规范副标题 -->
            <div id="sub-title-section" style="border-left: 4px solid #1E3A5F; padding-left: 24px;">
                <p style="color: #6B7C93; font-size: 20px; font-weight: 500; line-height: 1.6;">
                    [副标题/核心定义文案]
                </p>
            </div>

            <!-- 3. 规范网格内容 (3x2 布局) -->
            <div id="grid-section" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 40px;">
                <!-- 节点由 Skill 根据文案生成，标题 24px，正文 15px -->
            </div>

        </div>

        <!-- 固定元素 4: 品牌页脚 -->
        <footer style="background-color: #1E3A5F; padding: 40px; margin: 0 -45px -60px -45px; color: white;">
            <div id="dynamic-footer-summary" style="font-size: 25px; font-weight: 700; margin-bottom: 24px; line-height: 1.2;">
                [总结性金句]
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 24px;">
                <p style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.3em; text-transform: uppercase; color: rgba(255,255,255,0.4);">
                    From People to Systems
                </p>
                <div style="display: flex; gap: 8px;">
                    <div style="width: 12px; height: 12px; background-color: #C8102E;"></div>
                    <div style="width: 12px; height: 12px; background-color: rgba(255,255,255,0.2);"></div>
                </div>
            </div>
        </footer>
    </div>
</div>
