## 接口注册表

```yaml
interface_registry:
  meta_id: "meta-xxx"
  meta_name: "元名称"

  provided_interfaces:
    - interface_id: "iface-001"
      name: "接口名称"
      version: "1.0.0"
      status: "stable"
      consumers:
        - "meta-xxx"
        - "meta-yyy"

  consumed_interfaces:
    - interface_id: "iface-002"
      name: "依赖接口名称"
      version: ">=1.0.0"
      provider: "meta-zzz"

  dependencies:
    - meta_id: "meta-xxx"
      type: "required/optional"
      reason: "依赖原因"
```

