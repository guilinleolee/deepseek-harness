## 接口质量检查

```yaml
quality_checks:
  - check: "参数验证完整性"
    criteria: "所有参数都有类型和验证规则"

  - check: "错误处理完备性"
    criteria: "所有错误场景都有处理方案"

  - check: "超时设置合理性"
    criteria: "超时时间在可接受范围内"

  - check: "文档完整性"
    criteria: "接口有完整的使用文档和示例"

  - check: "测试覆盖率"
    criteria: "核心路径有单元测试"
```

