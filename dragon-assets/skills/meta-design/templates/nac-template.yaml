## NAC违反检测

```yaml
violation_detection:
  patterns:
    - name: "范围蔓延"
      indicator: "元开始处理原本不负责的领域"
      detection: "监控NAC边界任务占比"

    - name: "能力超载"
      indicator: "尝试处理无法胜任的任务"
      detection: "错误率上升、延迟增加"

    - name: "边界模糊"
      indicator: "职责重叠或真空地带"
      detection: "跨元依赖复杂度上升"

  responses:
    auto_detect: true
    auto_escalate: true
    escalation_target: "编排元/治理元"
```

