# NAC边界协议模板 - 元负面能力边界定义

> **版本**: V1.0
> **来源**: 天龙引擎V9.02 × 老金元组织方法论
> **用途**: 定义一个"元"不负责什么（NAC = Negative Attribute Capability）

---

## 基本信息

```yaml
nac_id: "nac-xxx"                    # NAC唯一标识符
meta_id: "meta-xxx"                    # 关联的元ID
meta_name: "元名称"                     # 元名称
version: "1.0.0"                        # 当前版本
created_date: "YYYY-MM-DD"             # 创建日期
```

---

## NAC定义原则

```
┌─────────────────────────────────────────────────────────────┐
│ NAC边界协议                                                │
├─────────────────────────────────────────────────────────────┤
│                                                             │
│ "元不是无限责任公司，它有明确的边界。"                        │
│                                                             │
│ "明确定义'不做什么'，比定义'做什么'更重要。"                   │
│                                                             │
│ "边界清晰 = 责任清晰 = 协作高效"                              │
│                                                             │
└─────────────────────────────────────────────────────────────┘
```

### NAC vs DAC

| 类型 | 含义 | 说明 |
|------|------|------|
| **DAC** | 正面能力（Do） | 元能做什么 |
| **NAC** | 负面能力（Not-Do） | 元不做什么 |

---

## NAC分类框架

### 1. 领域边界（Domain Boundaries）

```yaml
nac_categories:
  domain:
    responsible_for:           # 负责的领域
      - "领域A：具体职责"
      - "领域B：具体职责"

    not_responsible_for:       # 不负责的领域
      - "领域C：原因说明"
      - "领域D：原因说明"
      - "跨领域协调：应由编排元处理"
```

### 2. 能力边界（Capability Boundaries）

```yaml
capability:
  can_handle:
    - "能力1：描述"
    - "能力2：描述"

  cannot_handle:
    - "能力A：原因（超出当前能力范围）"
    - "能力B：原因（应升级到更高层级）"
    - "能力C：原因（应委托给其他元）"
```

### 3. 规模边界（Scale Boundaries）

```yaml
scale:
  within_scope:
    max_items: 1000           # 最大处理项数
    max_data_size: "10MB"    # 最大数据量
    max_concurrent: 10       # 最大并发数
    max_latency: "1s"        # 最大延迟

  out_of_scope:
    - "超过1000项：应分批处理或升级"
    - "超过10MB：应拆分为子任务"
    - "实时流处理：应使用专用流处理元"
```

### 4. 质量边界（Quality Boundaries）

```yaml
quality:
  acceptable:
    accuracy: ">=99%"        # 可接受的准确率
    availability: "99.9%"    # 可接受的可用性
    recovery_time: "<1min"   # 可接受的恢复时间

  not_acceptable:
    - "100%准确率要求：应使用人工复核"
    - "7x24无间断：应使用高可用架构"
    - "零错误容忍：应添加完整容错机制"
```

### 5. 安全边界（Security Boundaries）

```yaml
security:
  can_access:
    - "内部API"
    - "授权数据源"
    - "安全日志"

  cannot_access:
    - "外部互联网：需通过网关"
    - "敏感PII数据：需脱敏处理"
    - "系统配置：需管理员权限"
    - "其他租户数据：严格隔离"
```

