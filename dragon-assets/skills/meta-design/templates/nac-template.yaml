## NAC文档模板

```yaml
# NAC边界文档

## 元概述
[元名称] 负责 [核心职责]，其边界定义如下：

## 明确不负责
1. **领域A**：原因 + 应该由谁处理
2. **领域B**：原因 + 应该由谁处理
3. **领域C**：原因 + 应该由谁处理

## 边界触发条件
当遇到以下情况时，应触发NAC边界检查：
- 任务涉及多个领域
- 任务超出规模限制
- 任务需要跨元协作

## 边界处理流程
1. 识别是否在NAC范围内
2. 如果超出边界，评估是否可以拆分
3. 如果无法拆分，升级到编排元
4. 如果可以拆分，委托给相应元处理
```

