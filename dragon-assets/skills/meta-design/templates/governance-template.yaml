# 元治理矩阵模板 - 治理设计标准化

> **版本**: V1.0
> **来源**: 天龙引擎V9.02 × 老金元组织方法论
> **用途**: 定义元的治理设计，包括检查点、升级、兜底机制

---

## 基本信息

```yaml
governance_id: "gov-xxx"              # 治理ID
meta_id: "meta-xxx"                    # 关联的元ID
meta_name: "元名称"                     # 元名称
version: "1.0.0"                        # 版本
created_date: "YYYY-MM-DD"             # 创建日期
```

---

## 治理设计原则

```
┌─────────────────────────────────────────────────────────────┐
│ 组织镜像4标准                                               │
├─────────────────────────────────────────────────────────────┤
│                                                             │
│ 1. 明确分工                                                 │
│    → 谁产出，谁判断，谁复核，谁升级                          │
│                                                             │
│ 2. 明确升级路径                                             │
│    → 出了问题往哪里抬？                                      │
│                                                             │
│ 3. 明确复核点                                               │
│    → 哪些节点必须复核？                                     │
│                                                             │
│ 4. 明确兜底点                                              │
│    → 兜不住时谁接管？                                      │
│                                                             │
└─────────────────────────────────────────────────────────────┘
```

---

## 分工矩阵（RACIS）

```yaml
division_of_labor:
  # 谁负责执行（Responsible）
  responsible:
    - role: "执行者"
      meta_id: "meta-xxx"
      accountable_for:
        - "具体产出1"
        - "具体产出2"

  # 谁负责判断（Accountable）
  accountable:
    - role: "决策者"
      meta_id: "meta-yyy"
      accountable_for:
        - "判断决策1"
        - "判断决策2"

  # 谁被咨询（Consulted）
  consulted:
    - role: "咨询者"
      meta_id: "meta-zzz"
      accountable_for:
        - "专业意见1"

  # 谁被通知（Informed）
  informed:
    - role: "知情人"
      meta_id: "meta-aaa"
      accountable_for:
        - "状态同步1"

  # RACIS规则
  rules:
    - "每个任务至少有一个R"
    - "每个任务只有一个A"
    - "R和A不能是同一个"
    - "变更需通知所有I"
```

