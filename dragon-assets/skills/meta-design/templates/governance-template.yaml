## 治理指标

```yaml
metrics:
  - name: "执行成功率"
    target: ">=99%"
    actual: "实际值"
    frequency: "实时"

  - name: "升级频率"
    target: "<1%/天"
    actual: "实际值"
    frequency: "每日统计"

  - name: "升级响应时间"
    target: "<5分钟"
    actual: "实际值"
    frequency: "每次升级"

  - name: "复核通过率"
    target: ">=95%"
    actual: "实际值"
    frequency: "每周统计"

  - name: "兜底触发次数"
    target: "<0.1%/天"
    actual: "实际值"
    frequency: "每日统计"
```

