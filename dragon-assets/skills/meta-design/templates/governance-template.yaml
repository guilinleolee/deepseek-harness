## 升级路径设计（Escalation）

```yaml
escalation:
  levels:
    - level: 1
      name: "执行层"
      handler: "本元自愈"
      trigger:
        - "重试次数 > 3"
        - "时间 > SLA"
        - "错误类型: [黑名单]"
      timeout: "X分钟"
      action: "本地恢复/重试/降级"

    - level: 2
      name: "编排层"
      handler: "编排元协调"
      trigger:
        - "L1升级"
        - "跨元依赖失败"
        - "资源争用"
      timeout: "X分钟"
      action: "协调/重分配/暂停"

    - level: 3
      name: "治理层"
      handler: "治理元处理"
      trigger:
        - "L2升级"
        - "治理无效"
        - "需要业务决策"
      timeout: "X分钟"
      action: "修改配置/触发容灾"

    - level: 4
      name: "决策层"
      handler: "人工决策"
      trigger:
        - "L3升级"
        - "系统性失败"
        - "需业务方向决策"
      timeout: "人工判断"
      action: "人工介入/终止"

  rules:
    - "升级必须有时间戳"
    - "升级必须说明原因"
    - "升级必须记录响应时间"
    - "循环升级必须被检测和阻止"
```

