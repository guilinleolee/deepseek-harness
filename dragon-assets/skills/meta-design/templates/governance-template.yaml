## 兜底协议（Fallback）

```yaml
fallback:
  scenarios:
    - scenario: "场景描述"
      trigger:
        condition: "触发条件"
        threshold: "阈值"

      primary_fallback:
        action: "主兜底动作"
        timeout: "X分钟"
        recovery: "恢复步骤"

      secondary_fallback:
        action: "备兜底动作"
        timeout: "X分钟"
        recovery: "恢复步骤"

      final_fallback:
        action: "最终兜底"
        handler: "接管者"
        procedure: "完整流程"

      post_fallback:
        - "必须复盘"
        - "复盘时限: X天"
        - "责任人: xxx"
        - "预防措施: xxx"

  circuit_breaker:
    enabled: true
    threshold:
      error_rate: ">50%"
      timeout_rate: ">30%"
      consecutive_failures: ">5"

    state:
      open:
        duration: "60s"
        action: "拒绝请求"
      half_open:
        requests: "3"
        action: "测试恢复"
```

