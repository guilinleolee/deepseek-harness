## 复核点设计（Checkpoints）

```yaml
checkpoints:
  - checkpoint_id: "cp-001"
    name: "复核点名称"
    when: "执行前/执行后/关键里程碑"

    what:
      - "检查项1：具体检查内容"
      - "检查项2：具体检查内容"

    criteria:
      - "标准1：可量化"
      - "标准2：可验证"

    who: "复核者"
    method: "自动/人工"

    on_pass: "继续执行"
    on_fail:
      action: "skip/rollback/notify/escalate"
      target: "升级目标"

  - checkpoint_id: "cp-002"
    name: "关键里程碑复核"
    when: "关键里程碑"

    what:
      - "里程碑完成情况"
      - "质量标准达成"
      - "风险状态"

    criteria:
      - "完成度 >= 100%"
      - "质量评分 >= 90分"

    who: "治理元"
    method: "自动"

    on_pass: "继续下一阶段"
    on_fail:
      action: "escalate"
      target: "元审查师"
```

