## 治理设计

```yaml
governance:
  checkpoints:
    - id: "cp-1"
      when: "执行前/执行后/关键里程碑"
      check: "检查什么"
      on_fail: "skip/rollback/notify/escalate"
      responsible: "谁复核"

  escalation:
    level_1:
      trigger: "局部失败"
      handler: "本元自愈"
      timeout: "X分钟"

    level_2:
      trigger: "跨元依赖失败"
      handler: "编排协调元"
      timeout: "X分钟"

    level_3:
      trigger: "系统性失败"
      handler: "元审查师"
      timeout: "X分钟"

  fallback:
    - scenario: "场景"
      condition: "触发条件"
      action: "兜底动作"
      recovery: "恢复步骤"
```

---

## 生命周期

```yaml
lifecycle:
  entry_criteria:
    - "激活条件1"
    - "激活条件2"

  exit_criteria:
    - "完成条件1"
    - "完成条件2"

  error_handling:
    local_errors:
      - type: "错误类型A"
        handling: "处理方式"

    escalated_errors:
      - type: "错误类型B"
        handler: "升级到"

  metrics:
    - name: "指标名称"
      target: "目标值"
      actual: "实际值"
      frequency: "采集频率"
```

