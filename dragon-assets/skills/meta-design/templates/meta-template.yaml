## 综合评分

```yaml
quality_score:
  total_possible: 25
  actual_score: ___
  percentage: ___%

  breakdown:
    independence: __/5
    granularity: __/5
    boundaries: __/5
    replaceability: __/5
    reusability: __/5

  qualification:
    passed: true/false
    grade: "优秀/良好/及格/不及格"

    improvements_needed:
      - "改进1"
      - "改进2"
```

