# evalite-benchmark 配置文件
# 用于评估多个LLM模型的性能对比

name: "llm-benchmark"
version: "1.0.0"

# 模型配置
models:
  - name: "gpt-4o"
    provider: "openai"
    model_id: "gpt-4o"
    api_key_env: "OPENAI_API_KEY"
    extra_params:
      temperature: 0.1
      max_tokens: 2048

  - name: "claude-3-5-sonnet"
    provider: "anthropic"
    model_id: "claude-3-5-sonnet-20240620"
    api_key_env: "ANTHROPIC_API_KEY"
    extra_params:
      temperature: 0.1
      max_tokens: 2048

  - name: "gemini-pro"
    provider: "google"
    model_id: "gemini-1.5-pro"
    api_key_env: "GOOGLE_API_KEY"
    extra_params:
      temperature: 0.1
      max_tokens: 2048

# 数据集配置
dataset:
  source: "./datasets/custom.json"
  format: "json"
  shuffle: true

# 评估配置
evaluation:
  trials: 5
  timeout: 30
  parallel: true
  max_parallel_models: 3

# 统计配置
statistical:
  test: "t-test"
  alpha: 0.05
  confidence_interval: 0.95

# 报告配置
reporting:
  formats:
    - "html"
    - "markdown"
    - "json"
  output_dir: "./results"
  include_charts: true
  include_stats: true
  include_raw_data: true

# 回归检测配置
regression:
  enabled: true
  baseline_file: "./results/baseline.json"
  alert_threshold: 0.05
