# cua-driver-bridge runtime config
# Generated by dragon-engine stage 27 · 2026-08-26
# Mirror of trycua/cua/libs/cua-driver

[cli]
# Cua Driver exposes MCP over stdio + standalone CLI
command = cua-driver
mcp_subcommand = cua-driver mcp
call_subcommand = cua-driver call
version_check = cua-driver --version

[platforms]
darwin_arm64 = pkg-installer
darwin_x86_64 = pkg-installer
windows_x64 = powershell-install
linux_x64 = bash-install

[permission_mode]
# standard (default) | bounded | unrestricted
default = standard
env_var = CUA_DRIVER_PERMISSION_MODE

[capability_manifest]
file = CUA_DRIVER_CAPABILITY_MANIFEST_FILE
approved_var = CUA_DRIVER_CAPABILITY_MANIFEST_APPROVED

[paths]
source = "C:/Users/li/.claude/projects/dragon-engine/skills/cua-driver-bridge"
work_area = "C:/Users/li/.claude/projects/skills/cua-driver-bridge"
project_mirror = "C:/Users/li/.claude/projects/dragon-engine/.claude/skills/cua-driver-bridge"