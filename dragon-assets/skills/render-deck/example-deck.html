<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>小红书图文样例</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1440px;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #12121a 0%, #1e1e2e 55%, #0f0f16 100%);
    color: #f5f5f7;
    display: flex; flex-direction: column;
    padding: 96px 84px 72px;
    position: relative; overflow: hidden;
  }
  .kicker {
    font-size: 26px; letter-spacing: 6px; text-transform: uppercase;
    color: #7dd3fc; margin-bottom: 40px;
  }
  h1 { font-size: 92px; line-height: 1.18; font-weight: 800; letter-spacing: -1px; }
  h1 em { font-style: normal; color: #7dd3fc; }
  .rule { width: 96px; height: 8px; background: #7dd3fc; border-radius: 4px; margin: 56px 0; }
  ul { list-style: none; }
  li {
    font-size: 40px; line-height: 1.5; margin-bottom: 34px;
    padding-left: 46px; position: relative; color: #d5d5dd;
  }
  li::before {
    content: ""; position: absolute; left: 0; top: 20px;
    width: 20px; height: 20px; border-radius: 50%; background: #7dd3fc;
  }
  .footer {
    margin-top: auto; display: flex; justify-content: space-between;
    align-items: center; font-size: 26px; color: #8b8b98;
    border-top: 1px solid rgba(255,255,255,.12); padding-top: 36px;
  }
  .badge { padding: 12px 30px; border: 2px solid #7dd3fc; border-radius: 999px; color: #7dd3fc; }
  .glow {
    position: absolute; width: 640px; height: 640px; right: -180px; top: -160px;
    background: radial-gradient(circle, rgba(125,211,252,.28), transparent 70%);
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="kicker">Zero-AGPL Render Path</div>
  <h1>不装 AGPL<br>也能<em>出成品图</em></h1>
  <div class="rule"></div>
  <ul>
    <li>策划层：xhs-visual-director（MIT）</li>
    <li>渲染层：自建 headless Chrome 脚本</li>
    <li>素材层：baoyu 系列（MIT）</li>
  </ul>
  <div class="footer">
    <span>© 2026 内容工作室</span>
    <span class="badge">样例</span>
  </div>
</body>
</html>
