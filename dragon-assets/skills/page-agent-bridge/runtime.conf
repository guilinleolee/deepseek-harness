# page-agent-bridge runtime config
# Generated by dragon-engine stage 27 ROI-5 · 2026-08-26
# Mirror of alibaba/page-agent (28.8k ⭐ · MIT)

[cdn]
# Pure upstream CDN (per ROI-5 user decision · no demo CDN)
iife_url = "https://cdn.jsdelivr.net/npm/page-agent@1.12.2/dist/iife/page-agent.js"
china_mirror = "https://registry.npmmirror.com/page-agent/1.12.2/files/dist/iife/page-agent.js"
note = "Default does NOT bundle demo CDN (alibaba free testing LLM · upstream prohibits redistribution)"

[npm]
pkg = page-agent
version = 1.12.2
install = "npm install page-agent"

[mcp_server]
status = "Beta"
purpose = "Allow external agent clients to control the browser"

[chrome_extension]
status = "optional"
purpose = "Multi-page tasks · cross-tab reach"

[llm]
recommended_provider = qwen
recommended_model = qwen3.5-plus
recommended_base_url = https://dashscope.aliyuncs.com/compatible-mode/v1
# 备选 provider · 用户可换
fallback_openai = "openai/gpt-5.5"
fallback_anthropic = "anthropic/claude-opus-4-8"
fallback_local_ollama = "ollama (本地)"

[supported_models_doc]
url = "https://alibaba.github.io/page-agent/docs/features/models"

[language]
default = en-US
supported = ["en-US", "zh-CN", "zh-TW", "ja-JP", "ko-KR"]

[paths]
source = "C:/Users/li/.claude/projects/dragon-engine/skills/page-agent-bridge"
work_area = "C:/Users/li/.claude/projects/skills/page-agent-bridge"
project_mirror = "C:/Users/li/.claude/projects/dragon-engine/.claude/skills/page-agent-bridge"