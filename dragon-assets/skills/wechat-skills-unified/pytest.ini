[pytest]
# pytest配置文件

# 测试路径
testpaths = tests

# Python路径
pythonpath = .

# 导入模式：使用importlib以支持相对导入
import_mode = importlib

# 标记
markers =
    slow: 标记慢速测试
    integration: 标记集成测试
    unit: 标记单元测试

# 日志
log_cli = true
log_cli_level = INFO

# 覆盖率配置（如果安装了pytest-cov）
[coverage:run]
source = .
omit =
    tests/*
    */__pycache__/*
    .pytest_cache/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
