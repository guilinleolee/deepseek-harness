[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-anything"
version = "1.0.0"
description = "All-in-One multimodal RAG framework based on LightRAG"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rag_anything_core*", "rag_anything_mineru*", "rag_anything_multimodal*", "rag_anything_knowledge_graph*"]
