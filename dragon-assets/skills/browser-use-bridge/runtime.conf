# browser-use-bridge runtime config
# Generated by dragon-engine stage 27 · 2026-08-26
# Mirror of browser-use/browser-use

[cli]
# CLI 安装 via uv 或 pip
command = browser-use
install_python = "uv add browser-use"
install_python_alt = "pip install browser-use"
version_check = browser-use --version

[cloud_sdk]
# Cloud SDK (V4 API · 推荐生产档)
python_pkg = browser-use-sdk
node_pkg = browser-use-sdk
rest_base = https://api.browser-use.com/api/v4
auth_header = X-Browser-Use-API-Key

[api_v4_endpoints]
runs_create = "POST /api/v4/runs"
runs_wait = "GET /api/v4/runs/{run_id}/completion"
browsers_create = "POST /api/v4/browsers"
browsers_stop = "PATCH /api/v4/browsers/{session_id}"

[skill_install]
# agent (Claude Code / Codex / Hermes / OpenClaw)
install_command = "Install or upgrade browser-use to the latest stable version with uv using Python 3.12, run `browser-use skill install` to register the skill, and connect it to my browser."
fallback_doc = https://github.com/browser-use/browser-harness/blob/main/install.md

[env_keys]
required = []
optional = ["BROWSER_USE_API_KEY", "OPENAI_API_KEY", "ANTHROPIC_API_KEY", "GOOGLE_API_KEY"]

[llm_strategy]
recommended = "bu-2-0-mini-preview"
fallback_open_source = "bu-30-0-a3b-preview"
provider_prefixed_anthropic = "anthropic/claude-opus-4-8"
provider_prefixed_openai = "openai/gpt-5.5"
provider_prefixed_google = "google/gemini-3-pro"
chat_browser_use_class = "ChatBrowserUse"

[paths]
source = "C:/Users/li/.claude/projects/dragon-engine/skills/browser-use-bridge"
work_area = "C:/Users/li/.claude/projects/skills/browser-use-bridge"
project_mirror = "C:/Users/li/.claude/projects/dragon-engine/.claude/skills/browser-use-bridge"