<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Core Tech Scene</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root {
      --primary: #6366f1;
      --secondary: #8b5cf6;
      --accent: #06b6d4;
      --background: #0f0f23;
      --text: #f1f5f9;
      --particle: rgba(99,102,241,0.8);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    #scene-core-tech {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column;
    }
    #scene-core-tech canvas {
      position: absolute;
      top: 0; left: 0;
      pointer-events: none;
      width: 100%; height: 100%;
    }
    .core-tech-content {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 2rem;
    }
    .core-title {
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 700;
      margin-bottom: 2rem;
      opacity: 0.9;
    }
    .core-metrics {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .metric {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(6,182,212,0.15));
      border: 1px solid rgba(6,182,212,0.3);
      border-radius: 20px;
      padding: 1.5rem 3rem;
      backdrop-filter: blur(10px);
    }
    .metric-value {
      font-size: clamp(3rem, 10vw, 6rem);
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent), var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }
    .metric-unit {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--accent);
      margin-top: 0.25rem;
    }
    .metric-label {
      font-size: 1rem;
      opacity: 0.7;
      margin-top: 0.5rem;
    }
    .core-desc {
      font-size: 1.1rem;
      opacity: 0.75;
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div id="scene-core-tech" class="scene">
    <canvas id="particle-core" data-component="particle-spiral"></canvas>
    <div class="core-tech-content">
      <h2 class="core-title" id="core-title">{{title}}</h2>
      <div class="core-metrics">
        <div class="metric">
          <span class="metric-value" id="metric-value">{{metricValue}}</span>
          <span class="metric-unit" id="metric-unit">{{metricUnit}}</span>
          <span class="metric-label" id="metric-label">{{metricLabel}}</span>
        </div>
      </div>
      <p class="core-desc" id="core-desc">{{description}}</p>
    </div>
  </div>

  <script>
    (function() {
      const sceneEl = document.getElementById('scene-core-tech');

      const coreTl = gsap.timeline({ paused: true });

      // Mount particle
      coreTl.call(() => {
        if (window.__registry && window.__registry['particle-spiral']) {
          window.__registry['particle-spiral'].mount(sceneEl.querySelector('canvas'));
        }
      }, null, 0);

      // Title entrance
      coreTl.fromTo('#core-title',
        { y: -40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.3
      );

      // Metric counter animation
      coreTl.fromTo('.metric',
        { scale: 0.5, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.8, ease: "back.out(1.4)" },
        0.8
      );

      // Animate metric number
      const metricEl = document.getElementById('metric-value');
      const targetVal = parseFloat(metricEl.textContent);
      const obj = { val: 0 };
      coreTl.to(obj, {
        val: targetVal,
        duration: 2,
        ease: "power2.out",
        onUpdate: function() {
          metricEl.textContent = Math.round(obj.val);
        }
      }, 1.0);

      // Description fade in
      coreTl.fromTo('#core-desc',
        { opacity: 0, y: 20 },
        { opacity: 0.75, y: 0, duration: 0.5, ease: "power2.out" },
        2.5
      );

      // Unmount particle
      coreTl.call(() => {
        if (window.__registry && window.__registry['particle-spiral']) {
          window.__registry['particle-spiral'].unmount();
        }
      }, null, 6);

      window.__timelines = window.__timelines || {};
      window.__timelines['scene-core-tech'] = coreTl;

      window.__sceneConfigs = window.__sceneConfigs || {};
      window.__sceneConfigs['scene-core-tech'] = {
        type: 'core-tech',
        duration: {{duration}},
        content: { title: '{{title}}', metricValue: '{{metricValue}}', metricUnit: '{{metricUnit}}', metricLabel: '{{metricLabel}}', description: '{{description}}' }
      };
    })();
  </script>
</body>
</html>
