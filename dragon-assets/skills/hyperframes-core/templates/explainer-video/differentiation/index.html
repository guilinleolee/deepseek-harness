<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Differentiation Scene</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root {
      --primary: #6366f1;
      --secondary: #8b5cf6;
      --accent: #06b6d4;
      --background: #0f0f23;
      --text: #f1f5f9;
      --particle: rgba(99,102,241,0.8);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    #scene-differentiation {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column;
    }
    .diff-comparison {
      position: relative;
      z-index: 10;
      display: flex;
      gap: 2rem;
      padding: 1rem 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .diff-column {
      flex: 1;
      min-width: 280px;
      max-width: 400px;
      padding: 1.5rem;
      border-radius: 16px;
      text-align: center;
    }
    .diff-column h3 {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid;
    }
    .diff-column.competitor {
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.25);
    }
    .diff-column.competitor h3 {
      color: #f87171;
      border-color: rgba(239,68,68,0.4);
    }
    .diff-column.ours {
      background: rgba(34,197,94,0.08);
      border: 1px solid rgba(34,197,94,0.25);
    }
    .diff-column.ours h3 {
      color: #4ade80;
      border-color: rgba(34,197,94,0.4);
    }
    .diff-list {
      list-style: none;
      text-align: left;
    }
    .diff-list li {
      padding: 0.6rem 0;
      font-size: 1rem;
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      line-height: 1.4;
    }
    .diff-column.competitor .diff-list li {
      color: rgba(248,113,113,0.85);
    }
    .diff-column.ours .diff-list li {
      color: #4ade80;
    }
    .diff-list li::before {
      content: '✗';
      font-size: 0.9rem;
      margin-top: 0.1rem;
      flex-shrink: 0;
    }
    .diff-column.ours .diff-list li::before {
      content: '✓';
      color: #4ade80;
    }
    .diff-divider {
      width: 3px;
      background: linear-gradient(to bottom, transparent, var(--accent), transparent);
      border-radius: 2px;
      min-height: 200px;
    }
    .diff-summary {
      position: relative;
      z-index: 10;
      text-align: center;
      max-width: 700px;
      font-size: 1.05rem;
      opacity: 0.8;
      margin-top: 1.5rem;
      line-height: 1.6;
      padding: 0 2rem;
    }
  </style>
</head>
<body>
  <div id="scene-differentiation" class="scene">
    <div class="diff-comparison">
      <div class="diff-column competitor">
        <h3>{{competitorTitle}}</h3>
        <ul class="diff-list" id="competitor-list">
          {{competitorList}}
        </ul>
      </div>
      <div class="diff-divider"></div>
      <div class="diff-column ours">
        <h3>{{oursTitle}}</h3>
        <ul class="diff-list" id="ours-list">
          {{oursList}}
        </ul>
      </div>
    </div>
    <p class="diff-summary" id="diff-summary">{{summary}}</p>
  </div>

  <script>
    (function() {
      const sceneEl = document.getElementById('scene-differentiation');

      const diffTl = gsap.timeline({ paused: true });

      // Competitor column
      diffTl.fromTo('.diff-column.competitor',
        { x: -60, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
        0.3
      );

      // Competitor items stagger
      diffTl.fromTo('#competitor-list li',
        { x: -20, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.4, stagger: 0.1, ease: "power2.out" },
        0.8
      );

      // Divider
      diffTl.fromTo('.diff-divider',
        { scaleY: 0, opacity: 0 },
        { scaleY: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        1.2
      );

      // Ours column
      diffTl.fromTo('.diff-column.ours',
        { x: 60, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
        1.5
      );

      // Ours items stagger
      diffTl.fromTo('#ours-list li',
        { x: 20, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.4, stagger: 0.1, ease: "power2.out" },
        2.0
      );

      // Summary
      diffTl.fromTo('#diff-summary',
        { y: 30, opacity: 0 },
        { y: 0, opacity: 0.8, duration: 0.5, ease: "power2.out" },
        2.8
      );

      window.__timelines = window.__timelines || {};
      window.__timelines['scene-differentiation'] = diffTl;

      window.__sceneConfigs = window.__sceneConfigs || {};
      window.__sceneConfigs['scene-differentiation'] = {
        type: 'differentiation',
        duration: {{duration}},
        content: { competitorTitle: '{{competitorTitle}}', oursTitle: '{{oursTitle}}', summary: '{{summary}}' }
      };
    })();
  </script>
</body>
</html>
