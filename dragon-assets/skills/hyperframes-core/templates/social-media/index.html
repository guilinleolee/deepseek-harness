<!--
  Hyperframes 社媒视频模板 - TikTok/抖音/Reels
  尺寸: 1080x1920 (9:16)
  风格: {STYLE} (可配置)
  使用: npx hyperframes init --template social-media
-->
<div data-composition-id="social-{ID}" data-width="1080" data-height="1920">
  <style>
    /* 基础布局 */
    .scene {
      width: 1080px;
      height: 1920px;
      position: relative;
      overflow: hidden;
      font-family: {FONT_FAMILY};
    }

    /* 渐变背景 */
    .gradient-bg {
      position: absolute;
      inset: 0;
      background: {GRADIENT};
    }

    /* 主标题 */
    .headline {
      position: absolute;
      top: 200px;
      left: 60px;
      right: 60px;
      font-size: {HEADLINE_SIZE}px;
      font-weight: 700;
      color: {HEADLINE_COLOR};
      line-height: 1.2;
      max-width: 960px;
    }

    /* 副标题 */
    .subheadline {
      position: absolute;
      top: {SUBHEADLINE_TOP}px;
      left: 60px;
      right: 60px;
      font-size: {SUB_SIZE}px;
      color: {SUB_COLOR};
      line-height: 1.5;
      max-width: 900px;
    }

    /* CTA 按钮 */
    .cta {
      position: absolute;
      bottom: 300px;
      left: 60px;
      right: 60px;
      height: 120px;
      background: {CTA_BG};
      border-radius: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: 600;
      color: {CTA_COLOR};
    }

    /* 品牌标识 */
    .brand {
      position: absolute;
      bottom: 80px;
      left: 60px;
      font-size: 28px;
      color: rgba(255,255,255,0.7);
      letter-spacing: 2px;
    }

    /* 装饰元素 */
    .deco-circle {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      {DECO_STYLE};
      opacity: 0.15;
    }

    .deco-1 { top: -100px; right: -100px; }
    .deco-2 { bottom: 600px; left: -150px; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    // 场景1: 开头钩子
    (function() {
      const tl = gsap.timeline({ paused: true });

      // 背景入场
      tl.from(".gradient-bg", { opacity: 0, duration: 0.3 }, 0);

      // 装饰圆圈入场
      tl.from(".deco-circle", { scale: 0, opacity: 0, duration: 0.8, stagger: 0.1, ease: "back.out(1.7)" }, 0.2);

      // 主标题入场 - 从下方滑入
      tl.from(".headline", { y: 80, opacity: 0, duration: 0.6, ease: "{EASE_IN}" }, 0.4);

      // 副标题入场
      tl.from(".subheadline", { y: 40, opacity: 0, duration: 0.5, ease: "{EASE_IN}" }, 0.7);

      // CTA 入场
      tl.from(".cta", { y: 30, opacity: 0, scale: 0.9, duration: 0.4, ease: "back.out(1.7)" }, 1.2);

      // 品牌标识
      tl.from(".brand", { opacity: 0, duration: 0.4 }, 1.4);

      // 停留展示
      tl.to({}, { duration: {HOLD_DURATION} });

      // 结尾淡出
      tl.to(".scene", { opacity: 0, duration: 0.3 }, {HOLD_DURATION} + 0.1);

      window.__timelines["social-{ID}"] = tl;
    })();
  </script>

  <!-- 场景内容 -->
  <div class="scene">
    <div class="gradient-bg"></div>
    <div class="deco-circle deco-1"></div>
    <div class="deco-circle deco-2"></div>
    <div class="headline" data-start="0.4" data-duration="2.0">{HEADLINE_TEXT}</div>
    <div class="subheadline" data-start="0.7" data-duration="1.8">{SUBHEADLINE_TEXT}</div>
    <div class="cta" data-start="1.2" data-duration="0.5">{CTA_TEXT}</div>
    <div class="brand" data-start="1.4" data-duration="0.3">@{BRAND_HANDLE}</div>
  </div>

  <!-- 音频轨道 (可选) -->
  <audio data-audio-id="bgm" data-volume="0.3" data-media-start="0">
    <!-- <source src="bgm.mp3" type="audio/mp3"> -->
  </audio>
</div>
