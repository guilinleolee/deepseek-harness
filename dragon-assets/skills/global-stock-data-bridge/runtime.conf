# runtime.conf for global-stock-data-bridge V1.0
# 天龙引擎包装层 · Apache-2.0

[skill]
name = global-stock-data-bridge
version = 1.0
upstream = simonlin1212/global-stock-data V1.0.1
license = Apache-2.0
modified_by = 天龙引擎 dragon-engine
modified = 2026-07-27

[cli]
default = python
entry_points = em_global.py, em_global_check.py
python_min = 3.8

[throttle]
min_interval_sec = 1.0
jitter_sec_min = 0.1
jitter_sec_max = 0.5
max_retries = 3
session_keepalive = true

[fallback]
official_fallbacks = 3
fallback_strategy = priority_order
silent_failure = false
fallback_on_error_codes = ["429", "500", "502", "503", "504", "API_KEY_INVALID", "RATE_LIMIT"]

[storage]
output_dir = ./out
markdown_ext = .md
json_ext = .json

[tracing]
required_fields = source, endpoint, fetched_at, fallback_used
time_zone = UTC+8