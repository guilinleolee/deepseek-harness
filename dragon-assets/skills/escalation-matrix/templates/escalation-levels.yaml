# 升级层级定义模板
# 基于 组织镜像4标准 设计

escalation_levels:
  # ==========================================================================
  # Level 1: 执行层 (Execution Layer)
  # ==========================================================================
  level_1:
    name: "执行层"
    display_name: "L1-执行层"
    description: "元级别的自主处理，处理标准化任务和已知错误"

    capability:
      - "执行标准任务，按照预设流程处理"
      - "处理已知错误类型，执行预设修复方案"
      - "调用工具链完成具体操作"
      - "记录执行状态和结果"

    limits:
      - "无法处理预设外的错误类型"
      - "无法处理需要判断的边界情况"
      - "无法处理影响跨元的问题"
      - "无法进行资源调度决策"

    escalation_threshold:
      retry_exceeded: true        # 重试次数 > 3 次
      time_exceeded: true       # 执行时间 > SLA
      error_type_in_blacklist: true  # 错误类型在黑名单中
      unknown_error: true       # 无法识别的错误类型

    escalation_target: "level_2"

    response_time:
      max: "30秒"
      warning: "20秒"

    # 执行元配置
    execution_meta:
      max_retries: 3
      retry_interval: "5秒"
      timeout: "60秒"
      fallback_actions:
        - "记录错误详情"
        - "保存执行上下文"
        - "触发升级通知"

  # ==========================================================================
  # Level 2: 编排层 (Orchestration Layer)
  # ==========================================================================
  level_2:
    name: "编排层"
    display_name: "L2-编排层"
    description: "协调多 元协作，调度资源和任务分配"

    capability:
      - "协调多个元/Agent协作执行复杂任务"
      - "调整执行顺序和并行策略"
      - "重新分配资源和负载"
      - "处理跨元通信和依赖管理"
      - "识别升级触发条件并执行升级"

    limits:
      - "无法处理架构性变更请求"
      - "无法做出策略性决策"
      - "无法处理跨系统问题"
      - "无法进行资源采购或外部协调"

    escalation_threshold:
      coordination_failed: true        # 协调无效，资源耗尽
      dependency_blocked: true         # 依赖方不可用
      error_type_in_blacklist: true    # 错误类型在黑名单中
      resource_exhausted: true         # 资源完全耗尽
      cross_system_impact: true       # 影响多个系统

    escalation_target: "level_3"

    response_time:
      max: "5分钟"
      warning: "2分钟"

    # 编排元配置
    orchestration_meta:
      max_parallel_agents: 10
      dependency_timeout: "3分钟"
      coordination_timeout: "2分钟"
      fallback_actions:
        - "保存编排上下文"
        - "通知相关方"
        - "触发治理层介入"
        - "准备降级方案"

  # ==========================================================================
  # Level 3: 治理层 (Governance Layer)
  # ==========================================================================
  level_3:
    name: "治理层"
    display_name: "L3-治理层"
    description: "系统级问题处理，进行配置调整和流程修改"

    capability:
      - "修改元配置和执行参数"
      - "调整流程和策略"
      - "触发容灾和降级机制"
      - "处理跨系统协调"
      - "进行风险评估和决策"

    limits:
      - "无法做出业务方向决策"
      - "无法进行资源采购"
      - "无法处理外部依赖方问题"
      - "无法处理影响核心功能的严重故障"

    escalation_threshold:
      governance_ineffective: true      # 治理措施无效
      business_decision_required: true   # 需要业务决策
      core_function_impact: true        # 影响核心功能
      cross_system_failure: true        # 多系统故障
      security_incident: true           # 安全事件

    escalation_target: "level_4"

    response_time:
      max: "10分钟"
      warning: "5分钟"

    # 治理元配置
    governance_meta:
      config_modification: true
      process_adjustment: true
      disaster_recovery: true
      risk_assessment: true
      fallback_actions:
        - "启动应急预案"
        - "通知决策层"
        - "准备业务连续性方案"
        - "记录故障根因"

  # ==========================================================================
  # Level 4: 决策层 (Decision Layer)
  # ==========================================================================
  level_4:
    name: "决策层"
    display_name: "L4-决策层"
    description: "最高决策和资源调配，处理业务和战略问题"

    capability:
      - "做出业务方向决策"
      - "审批重大变更"
      - "进行外部协调和资源调配"
      - "处理危机和紧急情况"
      - "决定降级/熔断策略"

    limits: []  # 无限制，最终兜底层

    escalation_threshold:
      # 无进一步升级，最终兜底
      bypass_all: true

    # 兜底配置
    bottom_line:
      is_final_layer: true
      authority:
        - "业务决策"
        - "资源调配"
        - "外部协调"
        - "危机处理"
      response_time:
        max: "30分钟"
        urgent: "5分钟"
      fallback_actions:
        - "启动危机响应流程"
        - "通知相关方"
        - "人工介入处理"
        - "记录完整故障报告"

# ==========================================================================
# 升级路径配置
# ==========================================================================
escalation_paths:
  # 正常升级路径
  normal:
    sequence:
      - "level_1"
      - "level_2"
      - "level_3"
      - "level_4"
    skip_allowed: false
    parallel_escalation: false

  # 紧急升级路径（跳过中间层）
  urgent:
    triggers:
      - "security_incident"
      - "data_loss_risk"
      - "core_function_failure"
    sequence:
      - "level_1"
      - "level_4"    # 直接跳到决策层
    skip_allowed: true
    parallel_escalation: true

# ==========================================================================
# 升级通知配置
# ==========================================================================
notification:
  levels:
    level_1:
      notify: ["level_2"]
      template: "执行失败，需要编排层介入"

    level_2:
      notify: ["level_1", "level_3"]
      template: "协调失败，需要治理层介入"

    level_3:
      notify: ["level_2", "level_4"]
      template: "治理无效，需要决策层介入"

    level_4:
      notify: ["level_3", "stakeholders"]
      template: "决策层介入，危机响应启动"

# ==========================================================================
# 版本历史
# ==========================================================================
versions:
  - version: "1.0.0"
    date: "2026-04-24"
    author: "天龙引擎"
    changes:
      - "初始版本"