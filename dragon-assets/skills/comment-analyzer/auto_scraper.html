<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微博评论自动化爬取工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        .status {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .progress {
            background: #e9ecef;
            border-radius: 10px;
            height: 30px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        .btn {
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            margin-right: 10px;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: #6c757d;
        }
        .info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .info-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        .info-card h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }
        .info-card p {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 微博评论自动化爬取工具</h1>

        <div class="info">
            <div class="info-card">
                <h3>目标评论数</h3>
                <p>680条</p>
            </div>
            <div class="info-card">
                <h3>当前进度</h3>
                <p id="currentCount">0条</p>
            </div>
            <div class="info-card">
                <h3>完成率</h3>
                <p id="completionRate">0%</p>
            </div>
            <div class="info-card">
                <h3>状态</h3>
                <p id="statusText">待机</p>
            </div>
        </div>

        <div class="progress">
            <div class="progress-bar" id="progressBar">0%</div>
        </div>

        <button class="btn" id="startBtn" onclick="startScraping()">开始自动爬取</button>
        <button class="btn btn-secondary" id="stopBtn" onclick="stopScraping()" disabled>停止</button>
        <button class="btn btn-secondary" onclick="downloadData()" id="downloadBtn" disabled>下载数据</button>

        <div class="status" id="statusLog">
等待开始...
        </div>
    </div>

    <script>
        let isRunning = false;
        let comments = new Map();
        let stats = { iterations: 0, lastCount: 0, noNewCount: 0, maxIterations: 200 };
        let iframe = null;

        function log(message) {
            const logEl = document.getElementById('statusLog');
            const time = new Date().toLocaleTimeString();
            logEl.textContent += `[${time}] ${message}\n`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        function updateProgress() {
            const currentCount = comments.size;
            const progress = Math.min(100, (currentCount / 680 * 100)).toFixed(1);

            document.getElementById('currentCount').textContent = currentCount + '条';
            document.getElementById('completionRate').textContent = progress + '%';
            document.getElementById('progressBar').style.width = progress + '%';
            document.getElementById('progressBar').textContent = progress + '%';
        }

        function parseComment(text) {
            const colonIndex = text.indexOf(':');
            if (colonIndex === -1) return null;

            const username = text.substring(0, colonIndex).trim();
            const timeMatch = text.match(/(\d{1,2}-\d{1,2}-\d{1,2})\s+(\d{1,2}:\d{2})/);
            if (!timeMatch) return null;

            const time = timeMatch[1] + ' ' + timeMatch[2];
            const timeStartIndex = text.indexOf(timeMatch[0]);

            let content = text.substring(colonIndex + 1, timeStartIndex).trim();
            content = content.replace(/@[\u4e00-\u9fa5a-zA-Z0-9_]+/g, '').trim();
            content = content.replace(/^:+/, '').trim();
            content = content.replace(/\s+/g, ' ');

            if (content.length < 2) return null;

            const likeMatch = text.match(/(\d+)$/);
            const likes = likeMatch ? parseInt(likeMatch[1]) : 0;

            const uniqueId = username + '_' + content + '_' + time;

            return { username, content, time, likes, uniqueId };
        }

        function extractComments() {
            const commentList = iframe.contentDocument.querySelector('.wbpro-list');
            if (!commentList) return 0;

            const nodes = commentList.children;
            let newCount = 0;

            for (let i = 0; i < nodes.length; i++) {
                const text = nodes[i].textContent || '';
                const comment = parseComment(text);

                if (comment && !comments.has(comment.uniqueId)) {
                    comments.set(comment.uniqueId, comment);
                    newCount++;
                }
            }

            return comments.size;
        }

        function smartScroll() {
            const doc = iframe.contentDocument;
            const win = iframe.contentWindow;

            const commentList = doc.querySelector('.wbpro-list');
            if (commentList) {
                commentList.scrollTop = commentList.scrollHeight;
            }

            win.scrollTo(0, doc.body.scrollHeight);

            const buttons = Array.from(doc.querySelectorAll('*')).filter(el => {
                const text = el.textContent || '';
                return (text.includes('加载更多') || text.includes('点击加载') || text.includes('展开'))
                    && el.offsetParent !== null;
            });

            if (buttons.length > 0) {
                buttons[0].click();
                log('点击了"加载更多"按钮');
            }
        }

        function switchSortOrder() {
            const doc = iframe.contentDocument;
            const sortButtons = Array.from(doc.querySelectorAll('*')).filter(el => {
                const text = el.textContent || '';
                return text.includes('按时间') || text.includes('按热度');
            });

            if (sortButtons.length > 0) {
                for (const btn of sortButtons) {
                    if (btn.textContent.includes('按时间')) {
                        btn.click();
                        log('已切换为"按时间"排序');
                        return true;
                    }
                }
            }
            return false;
        }

        async function startScraping() {
            if (isRunning) return;

            isRunning = true;
            comments.clear();
            stats = { iterations: 0, lastCount: 0, noNewCount: 0, maxIterations: 200 };

            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('statusText').textContent = '运行中';

            log('创建iframe加载微博页面...');

            // 创建iframe加载微博页面
            iframe = document.createElement('iframe');
            iframe.src = 'https://weibo.com/7985254173/QmWvGrm7G#comment';
            iframe.style.width = '100%';
            iframe.style.height = '600px';
            iframe.style.border = '1px solid #ddd';
            iframe.style.marginTop = '20px';

            document.querySelector('.container').appendChild(iframe);

            // 等待iframe加载
            await new Promise(resolve => {
                iframe.onload = resolve;
                setTimeout(resolve, 10000); // 最多等待10秒
            });

            log('页面已加载，开始爬取...');
            await new Promise(r => setTimeout(r, 3000));

            // 切换排序
            switchSortOrder();
            await new Promise(r => setTimeout(r, 2000));

            // 开始滚动
            log('开始滚动加载评论...');

            for (let i = 0; i < stats.maxIterations && isRunning; i++) {
                stats.iterations = i + 1;

                const currentCount = extractComments();
                updateProgress();

                if (i % 5 === 0 || currentCount >= 680) {
                    log(`迭代 ${i+1}/${stats.maxIterations} | 已加载: ${currentCount}条`);
                }

                if (currentCount >= 680) {
                    log('已达到目标评论数！');
                    break;
                }

                if (currentCount === stats.lastCount) {
                    stats.noNewCount++;
                    if (stats.noNewCount >= 15) {
                        log('连续15次无新评论，停止');
                        break;
                    }
                } else {
                    stats.noNewCount = 0;
                    stats.lastCount = currentCount;
                }

                smartScroll();
                await new Promise(r => setTimeout(r, 1200));
            }

            finishScraping();
        }

        function finishScraping() {
            isRunning = false;

            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('downloadBtn').disabled = false;
            document.getElementById('statusText').textContent = '已完成';

            const finalCount = comments.size;
            log('');
            log('='.repeat(60));
            log('爬取完成！');
            log(`目标: 680条 | 实际: ${finalCount}条 | 完成率: ${(finalCount/680*100).toFixed(1)}%`);
            log('='.repeat(60));

            // 显示TOP5
            const sortedComments = Array.from(comments.values()).sort((a, b) => b.likes - a.likes);
            log('');
            log('热门评论 TOP5:');
            log('-'.repeat(60));
            sortedComments.slice(0, 5).forEach((c, i) => {
                log(`${i+1}. @${c.username} | 👍 ${c.likes} | ${c.time}`);
                log(`   ${c.content.substring(0, 50)}...`);
            });

            log('');
            log('点击"下载数据"按钮保存JSON文件');
        }

        function stopScraping() {
            isRunning = false;
            log('用户停止爬取');
            finishScraping();
        }

        function downloadData() {
            const sortedComments = Array.from(comments.values()).sort((a, b) => b.likes - a.likes);

            const data = {
                url: 'https://weibo.com/7985254173/QmWvGrm7G#comment',
                target_count: 680,
                actual_count: sortedComments.length,
                completion_rate: (sortedComments.length / 680 * 100).toFixed(1) + '%',
                extracted_at: new Date().toISOString(),
                comments: sortedComments
            };

            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `weibo_auto_comments_${new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19)}.json`;
            a.click();
            URL.revokeObjectURL(url);

            log('数据已下载！');
        }

        // 页面加载时初始化
        window.onload = function() {
            log('工具已就绪，点击"开始自动爬取"按钮开始');
            log('目标: 爬取680条微博评论');
            log('');
        };
    </script>
</body>
</html>
