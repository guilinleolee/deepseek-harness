# Swarm Intelligence Configuration

# LLM配置
llm:
  provider: openai  # openai/azure/alibaba/anthropic
  model: qwen-plus
  api_key: ${OPENAI_API_KEY}
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1

# 备选模型配置
models:
  - name: qwen-plus
    provider: alibaba
    use_case: [prediction, simulation]
    cost_tier: medium

  - name: claude-sonnet-4-6
    provider: anthropic
    use_case: [report_generation]
    cost_tier: high

  - name: gpt-4o
    provider: openai
    use_case: [graph_building]
    cost_tier: medium

# 仿真配置
simulation:
  max_agents: 1000000
  default_platform: twitter
  steps_per_run: 10
  parallel_workers: 4

  # 平台配置
  platforms:
    twitter:
      actions: [like, retweet, reply, follow, search, post]
      character_limit: 280

    reddit:
      actions: [upvote, downvote, comment, post, award]
      character_limit: 40000

    weibo:
      actions: [like, repost, comment, follow, search, post]
      character_limit: 2000

    xiaohongshu:
      actions: [like, collect, comment, follow, post]
      character_limit: 1000

# 记忆配置
memory:
  provider: zep  # zep/local/chroma
  zep:
    api_key: ${ZEP_API_KEY}
    collection: swarm_memory

  local:
    db_path: ~/.swarm/memory.db
    vector_db: chroma

# 推演配置
prediction:
  parallel_paths: 3
  confidence_threshold: 0.7
  max_steps: 50
  timeout_seconds: 300

  # 变量权重
  variable_weights:
    default: 1.0
    policy: 1.5
    technology: 1.2
    competition: 1.3

# GraphRAG配置
graph_rag:
  entity_types:
    - person
    - organization
    - location
    - event
    - concept

  relation_types:
    - related_to
    - part_of
    - influences
    - opposes
    - supports

  extraction:
    model: gpt-4o
    batch_size: 10

# Agent配置
agent:
  # 默认人设
  default_personality:
    openness: 0.5
    conscientiousness: 0.5
    extraversion: 0.5
    agreeableness: 0.5
    neuroticism: 0.5

  # 行为概率
  action_probabilities:
    like: 0.3
    comment: 0.15
    share: 0.1
    follow: 0.05
    post: 0.02

# 报告配置
report:
  output_formats: [json, markdown, html]
  include_timeline: true
  include_key_events: true
  include_visualizations: false

# API配置
api:
  host: 0.0.0.0
  port: 8000
  workers: 4
  cors_origins: ["*"]

# 日志配置
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: ~/.swarm/logs/swarm.log