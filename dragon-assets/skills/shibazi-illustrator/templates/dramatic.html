<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{BRAND_NAME}}: {{TITLE_MAIN}}</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=JetBrains+Mono:wght@700&display=swap');
        body {
            background: linear-gradient(135deg, #0F0F0F 0%, #1A1A1A 100%);
            font-family: 'Noto Sans SC', sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .poster-card {
            width: 600px;
            background: linear-gradient(180deg, #1A1A1A 0%, #0F0F0F 100%);
            border: 3px solid #FF4400;
            position: relative;
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            gap: 55px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(255, 68, 0, 0.3);
        }

        /* 高对比度网格 */
        .dramatic-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(90deg, rgba(255, 68, 0, 0.03) 1px, transparent 1px),
                linear-gradient(rgba(255, 68, 0, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 1;
        }

        /* 强光晕效果 */
        .glow-overlay {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 68, 0, 0.1) 0%, transparent 50%);
            z-index: 2;
            pointer-events: none;
        }

        .content-layer {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 50px;
        }

        /* 戏剧性页眉 */
        .dramatic-header {
            border-bottom: 3px solid #FF4400;
            padding-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-name {
            font-size: 16px;
            font-weight: 900;
            color: #FFFFFF;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 68, 0, 0.5);
        }

        .brand-version {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 700;
            color: #FF4400;
            letter-spacing: 0.1em;
        }

        /* 戏剧性标题 */
        .main-title {
            font-weight: 900;
            font-size: 56px;
            line-height: 1.05;
            letter-spacing: -0.03em;
            color: #FFFFFF;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
        }

        .title-highlight {
            color: #FF4400;
            text-shadow: 0 0 30px rgba(255, 68, 0, 0.6);
        }

        /* 戏剧性副标题 */
        .sub-title-box {
            border-left: 4px solid #FF4400;
            padding-left: 24px;
            background: linear-gradient(90deg, rgba(255, 68, 0, 0.1) 0%, transparent 100%);
            padding: 20px 24px;
            margin-left: -4px;
        }
        .sub-title-text {
            color: #E0E0E0;
            font-size: 22px;
            font-weight: 700;
            line-height: 1.5;
            letter-spacing: 0.02em;
        }

        /* 戏剧性核心模片 */
        .section-title {
            font-weight: 900;
            color: #FF4400;
            font-size: 20px;
            margin-bottom: 10px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255, 68, 0, 0.4);
        }
        .section-body {
            font-size: 14px;
            color: #B0B0B0;
            line-height: 1.7;
            font-weight: 400;
            letter-spacing: 0.01em;
        }

        /* 戏剧性页脚 */
        .footer-summary {
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 25px;
            line-height: 1.3;
            color: #FFFFFF;
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.8);
        }

        .dramatic-footer {
            border-top: 2px solid rgba(255, 68, 0, 0.3);
            padding-top: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tagline {
            font-size: 11px;
            color: #808080;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .indicator-dots {
            display: flex;
            gap: 8px;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .dot-active {
            background-color: #FF4400;
            box-shadow: 0 0 10px rgba(255, 68, 0, 0.8);
        }
        .dot-inactive {
            background-color: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="poster-card">
        <div class="dramatic-grid"></div>
        <div class="glow-overlay"></div>

        <div class="content-layer">

            <header class="dramatic-header">
                <div class="brand-name">{{BRAND_NAME}}</div>
                <div class="brand-version">{{BRAND_VERSION}}</div>
            </header>

            <div class="main-title">
                {{TITLE_MAIN}}<br/>
                <span class="title-highlight">{{TITLE_HIGHLIGHT}}</span>
            </div>

            <div class="sub-title-box">
                <p class="sub-title-text">
                    {{SUBTITLE}}
                </p>
            </div>

            <main style="display: grid; grid-template-columns: 1fr; gap: 35px;">
                {{SECTIONS}}
            </main>

            <footer class="dramatic-footer">
                <div>
                    <h2 class="footer-summary">
                        {{FOOTER_SUMMARY}}
                    </h2>
                    <div class="tagline">{{BRAND_TAGLINE}}</div>
                </div>
                <div class="indicator-dots">
                    <div class="dot dot-active"></div>
                    <div class="dot dot-inactive"></div>
                    <div class="dot dot-inactive"></div>
                </div>
            </footer>

        </div>
    </div>

</body>
</html>
