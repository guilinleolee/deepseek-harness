# runtime.conf for a-stock-data-bridge V1.0
# 天龙引擎包装层 · Apache-2.0

[skill]
name = a-stock-data-bridge
version = 1.0
upstream = simonlin1212/a-stock-data V3.4.0
license = Apache-2.0
modified_by = 天龙引擎 dragon-engine
modified = 2026-07-21

[cli]
default = python
entry_points = em_base.py, em_check.py
python_min = 3.8

[throttle]
# 节流默认值（与上游 em_get() 对齐）
min_interval_sec = 1.0
jitter_sec_min = 0.1
jitter_sec_max = 0.5
max_retries = 3
session_keepalive = true

[fallback]
# 3 官方备胎端点（V3.4.0 韧性层）
official_fallbacks = 3
fallback_strategy = priority_order
silent_failure = false
# 当主源失败时是否降级
fallback_on_error_codes = ["429", "500", "502", "503", "504", "BESTIP_EMPTY"]

[storage]
# 底稿输出目录
output_dir = ./out
markdown_ext = .md
json_ext = .json

[tracing]
# 每条数据必须带的溯源字段
required_fields = source, endpoint, fetched_at, fallback_used
time_zone = UTC+8
