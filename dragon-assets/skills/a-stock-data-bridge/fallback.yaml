  research_report_pdf:     [eastmoney_datacenter, tonghuashun, tonghuashun_iwencai]
  consensus_eps:           [eastmoney_datacenter, tonghuashun]
  iwencai_nl_search:       [tonghuashun_iwencai]
  industry_report:         [eastmoney_datacenter, tonghuashun]

  # ============ L3 信号层 9 端点 ============
