# fallback.yaml · a-stock-data-bridge V1.0
# 上游 V3.4.0 新增 3 官方备胎端点（韧性层），本文件给出每个端点的主/备 1/备 2/备 3 兜底链
# 行为：主源失败自动切备胎（非静默），必记录 fallback_used=True 到 FetchResult

official_fallbacks: 3  # V3.4.0 韧性层 3 官方备胎端点
fallback_strategy: priority_order
silent_failure: false  # 必报错，禁止静默
max_retries: 3

# 错误码决策树（按 [5] 错误码识别）
error_handlers:
  BESTIP_EMPTY:           # mootdx 0.11.x 兼容（上游 V3.2.4 修复）
    action: switch_source
    target: tencent
    log: "mootdx BESTIP 空串，切腾讯"
  PARAM_MISSING:
    action: fill_defaults
    log: "参数缺失，自动补默认"
  RATE_LIMIT_HIT:
    action: retry_with_backoff
    backoff_factor: 2.0
    max_retries: 3
  PROTOCOL_404:
    action: mark_deprecated
    log: "协议 404，标记 deprecated"
  TIMEOUT:
    action: retry_with_backoff
    backoff_factor: 1.5
    max_retries: 2
  CONNECTION_REFUSED:
    action: switch_source
    log: "连接被拒，切备胎"

# 43 端点兜底链（key=端点名，values=数据源顺序，从主到末）
