  five_level_quote:        [tencent, baidu, eastmoney_push2, xinlang]
  pe_pb_market_cap:        [eastmoney_push2, xinlang, tencent, baidu]
  index_etf_quote:         [eastmoney_push2, tencent, baidu, tonghuashun]
  minute_kline:            [mootdx, tencent, baidu]

  # ============ L2 研报层 5 端点 ============
